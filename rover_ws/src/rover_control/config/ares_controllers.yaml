# ARES-G ros2_control configuration (loaded by gazebo_ros2_control).
#
# Three controllers drive the genuine actuators:
#   * wheel_velocity_controller   - 6 drive wheels (velocity)
#   * steering_position_controller - 4 kingpins (position) -> four-wheel steering
#   * marker_position_controller   - 2-DOF marker arm (position)
#
# Joint ORDER here defines the index order the kinematics node must use when it
# publishes Float64MultiArray commands. Keep them in sync.

controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    wheel_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    steering_position_controller:
      type: position_controllers/JointGroupPositionController

    marker_position_controller:
      type: position_controllers/JointGroupPositionController

wheel_velocity_controller:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - mid_left_wheel_joint
      - mid_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint

steering_position_controller:
  ros__parameters:
    joints:
      - left_bogie_steer_joint
      - right_bogie_steer_joint
      - left_rear_steer_joint
      - right_rear_steer_joint

marker_position_controller:
  ros__parameters:
    joints:
      - marker_shoulder_joint
      - marker_elbow_joint
