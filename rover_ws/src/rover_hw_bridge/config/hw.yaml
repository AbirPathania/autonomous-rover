hw_bridge_node:
  ros__parameters:
    use_sim_time: true
    cmd_topic: /cmd_vel_safe        # safety-gated command from the safety manager

mcu_sim_node:
  ros__parameters:
    use_sim_time: true
    watchdog_timeout: 0.2           # hard-real-time safe-state timeout (s)
    control_rate: 100.0
    heartbeat_rate: 10.0
    feedback_rate: 50.0
    wheel_separation: 0.6
    wheel_radius: 0.15
    current_gain: 3.0
    overcurrent_a: 30.0
